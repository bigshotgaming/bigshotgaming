{% extends "master.html" %}
{% block title %} - Change Password{% endblock title %}
{% block content %}
<h1>Change Password</h1>
{% for error in errors %}<p class="error">{{ error }}</p>{% endfor %}
<form method="post" action="/accounts/password/change">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <table>
        <tr>
            <td><label for="old_password">Current password</label></td>
            <td><input type="password" name="old_password" id="old_password" /></td>
        </tr>
        <tr>
            <td><label for="new_password1">New password</label></td>
            <td><input type="password" name="new_password1" id="new_password1" /></td>
        </tr>
        <tr>
            <td><label for="new_password2">Confirm new password</label></td>
            <td><input type="password" name="new_password2" id="new_password2" /></td>
        </tr>
    </table>
    <input type="submit" value="Change Password" />
</form>
{% endblock content %}
