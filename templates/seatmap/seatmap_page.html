{% extends "master.html" %}
{% block content %}
<script type="text/javascript" src="{{ STATIC_URL }}seatmap/js/easeljs-0.5.0.min.js"></script>
<script type="text/javascript" src="{{ STATIC_URL }}seatmap/js/seatmap_functions.js"></script>
<link rel="stylesheet" type="text/css" href="{{ STATIC_URL }}seatmap/css/seatmap_styles.css" />
<h1>Seatmap</h1>
<div id="legend">
    <div class="yellow"></div>Yours &nbsp;
    <div class="green"></div>Open &nbsp;
    <div class="red"></div>Taken &nbsp;
    <div class="blue"></div>Admin
</div>
<button id="zoom-out-button" class="ui-state-default ui-corner-all" title="Zoom Out">
    <span class="ui-icon ui-icon-minusthick"></span>
</button>
<button id="zoom-in-button" class="ui-state-default ui-corner-all" title="Zoom In">
    <span class="ui-icon ui-icon-plusthick"></span>
</button>
<button id="pan-button" class="ui-state-default ui-corner-all" title="Pan">
    <span class="ui-icon ui-icon-arrow-4"></span>
</button>
<button id="select-seat-button" class="ui-state-default ui-corner-all" title="Select Seat">
    <span class="ui-icon ui-icon-arrowreturnthick-1-s"></span>
</button>
<span id="preview" style="position:relative; top:-10px;"></span>
<div id="seatmap-container" style="height:600px;"></div>
<div style="display:none;">
    <div id="select-seat-dialog">Is the highlighted seat okay?</div>
</div>
<div id="tooltip" style="position:absolute; background:rgba(33,33,33,0.8); padding:10px; border:1px solid white; display:none;">Tooltip</div>
<input type="hidden" id="seatmap_id" value="{{ seatmap_id | default(value='') }}">
<input type="hidden" id="user_username" value="{{ username }}">
{% if seat_data %}<input type="hidden" id="seat_data" value="{{ seat_data }}" />{% endif %}
{% if table_data %}<input type="hidden" id="table_data" value="{{ table_data }}" />{% endif %}
{% endblock content %}
